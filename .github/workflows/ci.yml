name: CI

on:
  push:
    branches: [main, dev, release]
  pull_request:
    branches: [main, dev, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin-compose:
    name: Kotlin Compose build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run JVM tests
        run: ./gradlew --no-daemon :composeApp:jvmTest

      - name: Compile Kotlin JVM app
        run: ./gradlew --no-daemon :composeApp:compileKotlinJvm

  server:
    name: Node server syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install server dependencies
        run: npm install --no-audit --no-fund

      - name: Check server JavaScript syntax
        run: node --check server.js

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build server Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          tags: traffictwin-server:test
