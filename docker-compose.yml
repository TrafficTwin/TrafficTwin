services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build: ./server  
    container_name: traffic_twin_app
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/traffic_twin
      - API_URL=http://localhost:3000
      - JWT_SECRET=traffic_twin_super_secret_kljuc_2024
      - ADMIN_EMAIL=admin@city.si
      - ADMIN_PASSWORD=admin123
    depends_on:
      - mongodb

volumes:
  mongo-data: